name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported floor and newest. Keep in sync with docs/escopo-e-fronteiras.md (Matriz de suporte).
        postgres: ['15', '18']
    env:
      WAYBILL_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer reads the version from tags
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/Waybill.Tests.Unit -c Release --no-build
      - run: dotnet test --project tests/Waybill.Tests.Integration -c Release --no-build --filter-not-trait "Category=Long"

  chaos:
    name: chaos (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      # Exit code 8 = zero tests ran; tolerated until stage 3 adds the first chaos scenarios.
      - run: dotnet test --project tests/Waybill.Tests.Chaos -c Release --no-build --filter-not-trait "Category=Long" --ignore-exit-code 8

  pack:
    needs: [test, chaos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet pack -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
