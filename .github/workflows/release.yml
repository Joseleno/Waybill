name: release

# vX.Y.Z[-prerelease] tags publish to nuget.org through Trusted Publishing (OIDC, no stored API key).
# Tags containing "-test" only validate the pipeline: the packages are pushed to a local folder feed and
# installed into a throwaway project, and nothing leaves the runner.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/Waybill.Tests.Unit -c Release --no-build
      # The long load (Category=Long) runs for hours; it belongs to the scheduled workflow, not to a release.
      - run: dotnet test --project tests/Waybill.Tests.Integration -c Release --no-build --filter-not-trait "Category=Long"
      - run: dotnet pack -c Release --no-build -o artifacts

      # Deterministic build, Source Link, symbols and metadata, on every tag, before anything is pushed.
      - name: Validate packages (Source Link, symbols, metadata)
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" Meziantou.Framework.NuGetPackageValidation.Tool --version 2.0.13
          "$RUNNER_TEMP/tools/meziantou.validate-nuget-package" --excluded-rules IconMustBeSet --github-token "${{ github.token }}" artifacts/*.nupkg

      - name: Validate packages from a local feed (test tags)
        if: contains(github.ref_name, '-test')
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/feed" "$RUNNER_TEMP/consumer"
          dotnet nuget push "artifacts/*.nupkg" --source "$RUNNER_TEMP/feed"
          cd "$RUNNER_TEMP/consumer"
          dotnet new console --framework net10.0
          dotnet new nugetconfig
          dotnet nuget add source "$RUNNER_TEMP/feed" --name local --configfile nuget.config
          for package in Waybill Waybill.EntityFrameworkCore.PostgreSql Waybill.RabbitMQ Waybill.Testing; do
            dotnet add package "$package" --version "$version" --source "$RUNNER_TEMP/feed"
          done
          dotnet build

      - name: NuGet login (Trusted Publishing)
        if: ${{ !contains(github.ref_name, '-test') }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        if: ${{ !contains(github.ref_name, '-test') }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
